name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BLENDER_URL: https://download.blender.org/release/Blender5.1/blender-5.1.2-linux-x64.tar.xz
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: blender
          key: ${{ env.BLENDER_URL }}

      - name: Download Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir blender
          curl -sSL "$BLENDER_URL" | tar -xJ -C blender --strip-components=1

      - name: Install runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1

      - name: Run headless tests
        run: ./blender/blender -b --factory-startup --python-exit-code 1 --python tests/run_tests.py

      - name: Build and validate the extension
        run: |
          ./blender/blender --factory-startup --command extension build --source-dir roundabout --output-dir dist
          ./blender/blender --factory-startup --command extension validate dist/*.zip
